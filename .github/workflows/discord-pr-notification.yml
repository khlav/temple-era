name: Discord PR Notification

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number"
        required: true
        default: "123"
      pr_title:
        description: "PR Title"
        required: true
        default: "Test Notification"
      pr_description:
        description: "PR Description"
        required: true
        default: 'This is a test notification with "double quotes".'
      pr_url:
        description: "PR URL"
        required: true
        default: "https://github.com/khlav/temple-era"
      merged_at:
        description: "Merged At Timestamp"
        required: true
        default: "2026-02-26T00:00:00Z"
      pr_scope:
        description: "Scope prefix (Website / Bot / Website + Bot / Repo)"
        required: false
        default: "Website"

jobs:
  notify-discord:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'user-facing')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Monorepo: derive a title prefix from which app the PR touched, so a bot
      # PR is not announced as "Website PR #N".
      - name: Determine PR scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=${{ github.event.inputs.pr_scope }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(gh pr view "${{ github.event.pull_request.number }}" \
                    --repo "${{ github.repository }}" \
                    --json files --jq '.files[].path')

          WEB=$(echo "$FILES" | grep -c '^apps/web/' || true)
          BOT=$(echo "$FILES" | grep -c '^apps/bot/' || true)

          if   [ "$WEB" -gt 0 ] && [ "$BOT" -gt 0 ]; then SCOPE="Website + Bot"
          elif [ "$WEB" -gt 0 ];                     then SCOPE="Website"
          elif [ "$BOT" -gt 0 ];                     then SCOPE="Bot"
          else                                            SCOPE="Repo"
          fi

          echo "Detected scope: $SCOPE (web files: $WEB, bot files: $BOT)"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_SCOPE: ${{ steps.scope.outputs.scope }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.inputs.pr_title || github.event.pull_request.title }}
          PR_DESCRIPTION: ${{ github.event.inputs.pr_description || github.event.pull_request.body }}
          PR_URL: ${{ github.event.inputs.pr_url || github.event.pull_request.html_url }}
          MERGED_AT: ${{ github.event.inputs.merged_at || github.event.pull_request.merged_at }}
        run: |
          chmod +x .github/scripts/discord-notify.sh
          .github/scripts/discord-notify.sh
