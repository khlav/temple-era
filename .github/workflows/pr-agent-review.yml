name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Self-hosted, DeepSeek-backed AI reviewer (github.com/The-PR-Agent/pr-agent).
  # Runs alongside Greptile, not instead of it - /fix-pr still drives off
  # Greptile's confidence score. This is a near-zero-incremental-cost second
  # opinion, not a replacement for the existing review gate.
  pr_agent:
    name: Archon
    # Skip bot-authored events, and skip issue_comment events on plain issues
    # (no linked PR) - PR-Agent flagged this exact gap on its own first run:
    # github.event.pull_request is null for a comment on a non-PR issue, and
    # without this guard the action would misfire on every issue comment.
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
          (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    steps:
      # No checkout step: PR-Agent reads the diff via the GitHub API directly
      # from the event payload, it doesn't need the code on disk.
      - name: PR Agent action step
        # Pinned to v0.41.1 by commit SHA rather than @main - Archon's own
        # first review on this PR flagged @main as a supply-chain risk: a
        # compromised upstream push would execute immediately with this
        # workflow's write permissions (issues, PRs, contents, checks).
        uses: the-pr-agent/pr-agent@743f52d80f3513193dfc7626f778c73478df6d0a # v0.41.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: "deepseek/deepseek-v4-pro"
          config.fallback_models: '["deepseek/deepseek-v4-flash"]'
          # PR-Agent's own default caps every model at 32K tokens regardless
          # of capability (pr_agent/algo/utils.py get_max_tokens()), which
          # would waste deepseek-v4's registered 1M-token limit. 256K is
          # ~2.5-3x this repo's largest real PR to date (#26, ~3,878 lines
          # changed, ~90-100K estimated tokens including diff + repo-context
          # overhead) - enough headroom for the next big dependency-upgrade
          # PR without going wide enough to invite long-context degradation.
          config.max_model_tokens: "256000"
          # PR-Agent's own pr_actions default is opened/reopened/ready_for_review/
          # review_requested - it silently ignores new commits (synchronize)
          # unless this is explicitly turned on, even though the workflow
          # trigger above already fires on synchronize. push_commands defaults
          # to ['/describe', '/review'], so this also refreshes the PR
          # description on every push, not just the review - trim it via
          # github_action_config.push_commands if that's not wanted.
          github_action_config.handle_push_trigger: "true"
          # Adds a PR-quality/readiness score to the review comment - off by
          # default, and 0-100 by default when on. Reformatted to X/5 below
          # via EXTRA_INSTRUCTIONS to mirror Greptile's confidence rating.
          PR_REVIEWER.REQUIRE_SCORE_REVIEW: "true"
          # Off: this repo doesn't consistently link PRs to GitHub Issues, and
          # the ticket-compliance check mismatched this PR against an
          # unrelated, already-merged PR/issue (#26) on its first live run -
          # a false positive, not a real gap.
          PR_REVIEWER.REQUIRE_TICKET_ANALYSIS_REVIEW: "false"
          # score is a free-text field, not a strict number. The base schema
          # instruction (not ours to edit without forking) still tells the
          # model to compute 0-100 - so rather than asking for a fresh,
          # undefined 1-5 judgment (which would map 0-100 to 1-5 differently
          # every run), this keeps the 0-100 computation and adds a fixed,
          # deterministic conversion to a star display, mirroring Greptile's
          # X/5 confidence rating (also the scale /fix-pr already targets:
          # "until the confidence score hits 5/5"). Both numbers are shown so
          # the bucketing is checkable, not a black box.
          #
          # PLACEHOLDER BINS: equal-width quintiles, not tuned to anything -
          # deliberately the least-arbitrary default rather than a real
          # answer, since we only have one real score (85) to go on so far.
          # Revisit once several real PRs have gone through: PR-Agent's own
          # rubric sets a high bar for 100 ("no bugs, production-scale ready")
          # while Greptile's 5/5 in this repo's /fix-pr loop is a regularly-
          # reached "good enough, stop iterating" threshold, not "flawless" -
          # these quintiles may not match that in practice.
          PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            Compute the 'score' field as usual (0-100). Then format its
            displayed value as: filled/empty stars, "X/5", the raw "(N/100)"
            score, and a short qualitative label - using exactly this
            conversion table: 0-19 = 1 star, Needs significant rework;
            20-39 = 2 stars, Needs work; 40-59 = 3 stars, Getting there;
            60-79 = 4 stars, Nearly ready; 80-100 = 5 stars, Ready to merge.
            Example: a computed score of 85 becomes
            "★★★★★ 5/5 (85/100) - Ready to merge".
