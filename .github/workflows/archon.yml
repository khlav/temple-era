name: Archon

on:
  # issue_comment was dropped: Archon's own review flagged that any
  # commenter (not just collaborators) could fire paid DeepSeek-backed slash
  # commands (/review, /ask, etc.) against the repo's API key, since the old
  # if: only filtered bot senders, not non-members. Dropping the trigger
  # entirely removes that abuse surface rather than trying to allowlist
  # commenters.
  #
  # opened is back (reopened/ready_for_review still dropped): Archon's
  # review also caught that synchronize-only meant a PR opened with all its
  # commits already in place, then merged without any further push, never
  # got reviewed at all - the single most common PR flow had zero coverage.
  # Same fork/bot guards apply to both event types below.
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: archon-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Self-hosted AI reviewer (github.com/The-PR-Agent/pr-agent), primary model
  # set via config.model below. TEMPLE-44 restarts the primary-model trial
  # (again): TEMPLE-38's Luna run is abandoned, and GPT-5.6 proper takes the
  # primary slot - see the config.model comment for why Luna was the wrong
  # thing to be trialing. Runs alongside Greptile, not instead of it - /fix-pr
  # still drives off Greptile's confidence score. This is a near-zero-
  # incremental-cost second opinion, not a replacement for the existing
  # review gate.
  pr_review:
    name: PR review
    # Bot-sender guard, plus a fork guard Archon's own review flagged: PRs
    # from forks don't get repo secrets (OPENAI_KEY/DEEPSEEK_API_KEY come back
    # empty) and GITHUB_TOKEN is read-only, so every external contribution
    # would show a failed/red check rather than just skipping cleanly. Restricting
    # to same-repo PRs avoids that instead of trying to handle it gracefully.
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      # read, not write: Archon's own review flagged contents:write as overly
      # permissive. Everything we actually use (posting review comments,
      # /describe updating the PR description, adding labels) goes through
      # the issues/pull-requests API, not contents. Read is only needed for
      # PR-Agent to fetch repo context files like AGENTS.md - nothing here
      # commits code.
      contents: read
      # checks: write dropped - Archon's own review flagged it as unused.
      # Confirmed: we never set publish_as_check_run, the one setting that
      # would route any PR-Agent output through the Checks API instead of
      # regular PR comments. Everything enabled here (review, description-
      # as-comment, labels) goes through issues/pull-requests. Unused scope
      # only widens the blast radius of the third-party action the SHA
      # pinning was meant to contain.
    steps:
      # No checkout step: PR-Agent reads the diff via the GitHub API directly
      # from the event payload, it doesn't need the code on disk.

      # TEMPLE-9: minted first so PR-Agent's comment posts under the Archon
      # App's own identity (custom avatar) instead of the generic
      # github-actions[bot]. continue-on-error: true because this must never
      # block the actual review - if minting fails (app not installed,
      # secrets misconfigured, GitHub API hiccup), the empty token output
      # falls through to secrets.GITHUB_TOKEN below and the review still
      # posts, just unbranded. Requires the Archon App to hold Issues: R&W
      # and Pull requests: R&W (Metadata: Read-only is automatic) - the
      # Checks: R&W it already had only covers the badge step further down.
      - name: Mint Archon App token
        if: always()
        continue-on-error: true
        id: archon_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ARCHON_APP_ID }}
          private-key: ${{ secrets.ARCHON_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: PR Agent action step
        # Pinned to v0.41.1 by commit SHA rather than @main - Archon's own
        # first review on this PR flagged @main as a supply-chain risk: a
        # compromised upstream push would execute immediately with this
        # workflow's write permissions (issues, PRs, contents, checks).
        id: pr_agent
        uses: the-pr-agent/pr-agent@743f52d80f3513193dfc7626f778c73478df6d0a # v0.41.1
        env:
          # Archon App token first, GITHUB_TOKEN as fallback - see the mint
          # step above for why the fallback exists.
          GITHUB_TOKEN: ${{ steps.archon_app_token.outputs.token || secrets.GITHUB_TOKEN }}
          # Kept alongside OPENAI_KEY below so deepseek-v4-flash still works
          # as a cross-provider fallback - unrelated to which model is primary.
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # TEMPLE-44: GPT-5.6 Terra (OpenAI) as primary. This supersedes
          # TEMPLE-38, which trialed GPT-5.6 Luna in the same slot to close the
          # review-depth gap noted against Greptile in
          # docs/followups/pr-review-quality-log.md. That trial was aimed at
          # the wrong target: upstream's own configuration.toml lists
          # gpt-5.6-luna as the commented-out example for `model_weak` - "a
          # weaker model to use for some easier tasks" - so Luna was never a
          # candidate for closing a DEPTH gap, and DeepSeek Pro -> Flash ->
          # Luna was three consecutive moves along the cheap axis with none
          # along the capable one. Luna keeps its intended job below via
          # config.model_weak.
          #
          # Terra rather than full GPT-5.6, on cost. Terra is the middle tier -
          # upstream ships it as the default fallback beside gpt-5.6 - so this
          # is still a genuine move along the capable axis relative to Luna,
          # which is the point of the change, just not all the way to the top.
          # Archon runs on every opened and synchronize event, so the primary
          # model's per-review cost is multiplied by pushes per PR, not by PR
          # count. If review depth turns out to regress against the four valid
          # findings Terra's predecessor produced on this PR, the escalation
          # path is gpt-5.6 - not another step down.
          # Requires the OPENAI_KEY repo secret (see AGENTS.md's Secrets
          # section - this one deliberately lives outside Doppler, same as
          # DEEPSEEK_API_KEY, since it's CI infra rather than app config).
          # No provider prefix on the model id: unlike deepseek/..., OpenAI is
          # litellm's default provider, and PR-Agent's own GitHub Action docs
          # (docs.pr-agent.ai/installation/github) show config.model set to a
          # bare "gpt-4o"-style string with OPENAI_KEY, not OPENAI.KEY.
          # deepseek-v4-flash stays as fallback (existing, working, and
          # orthogonal to this comparison) rather than an untested same-
          # provider fallback - despite deepseek-v4-flash's own known
          # reliability gap (four incorrect technical claims in a row during
          # PR #32's own review cycle, the reason it was demoted from primary
          # originally). Acceptable here since fallback only fires when the
          # primary itself errors, not on every review.
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          config.model: "gpt-5.6-terra"
          config.fallback_models: '["deepseek/deepseek-v4-flash"]'
          # Previously unset, so PR-Agent used the primary model for the
          # cheaper sub-tasks too. Luna is upstream's own example weak model,
          # which is the role it should have had all along.
          config.model_weak: "gpt-5.6-luna"
          # Reverted from "high" back to PR-Agent's default of "medium":
          # cheap to reverse, as noted when "high" was tried, and the trial
          # didn't show a review-depth improvement that justified the extra
          # cost over the default.
          config.reasoning_effort: "medium"
          # PR-Agent's own default caps every model at 32K tokens regardless
          # of capability (pr_agent/algo/utils.py get_max_tokens()), which
          # would waste deepseek-v4's registered 1M-token limit. 256K is
          # ~2.5-3x this repo's largest real PR to date (#26, ~3,878 lines
          # changed, ~90-100K estimated tokens including diff + repo-context
          # overhead) - enough headroom for the next big dependency-upgrade
          # PR without going wide enough to invite long-context degradation.
          config.max_model_tokens: "256000"
          # repo_context_files defaults to ["AGENTS.md"] - repo-RELATIVE, so
          # only the root file was ever loaded and apps/web/AGENTS.md (478
          # lines of tRPC/Drizzle/API detail) was invisible to the reviewer.
          # That is most of why Archon reviewed generically.
          # Deliberately NOT just adding the two app files: all three total
          # ~1,090 lines, roughly half of which is commands, Doppler setup and
          # git conventions - noise on every review, and worse, process rules
          # lefthook already hard-enforces are exactly the false-positive bait
          # this change is trying to remove. docs/archon-review-context.md is
          # the reviewer-facing subset instead: only invariants that are
          # checkable from a diff and not already caught deterministically.
          # NOTE: repo_context_from_default_branch defaults to true, so these
          # are read from main - a PR that edits them is NOT reviewed under its
          # own version. This one takes effect on merge, not on itself.
          config.repo_context_files: '["AGENTS.md", "docs/archon-review-context.md"]'
          # Default is 500 rendered lines total, including wrapper tags - the
          # root file alone is 364, so the pair would be truncated mid-file
          # without this. 900 fits both (~560) with headroom for the context
          # file to grow, while staying well under the point where the diff
          # itself starts competing for attention.
          config.repo_context_max_lines: "900"
          # PR-Agent's own pr_actions default is opened/reopened/ready_for_review/
          # review_requested - it silently ignores new commits (synchronize)
          # unless this is explicitly turned on, even though the workflow
          # trigger above already fires on synchronize.
          github_action_config.handle_push_trigger: "true"
          # Default push_commands is ['/describe', '/review'] - re-running
          # /describe on every push burns a full LLM cycle just to refresh
          # the PR description, which /fix-pr and everything downstream
          # ignores; only /review's output is ever consumed after the first
          # push. Trimmed to /review alone to cut that cost. pr_commands
          # (the opened-event set, unset - upstream default) is untouched,
          # so /describe still runs once, on PR open.
          github_action_config.push_commands: '["/review"]'
          # SCORE REMOVED (TEMPLE-44). require_score_review was on, rendered
          # as "X/5 ★★★★★ (N/100)" to mirror Greptile's confidence rating, and
          # read by /fix-pr as an auto-exit condition (>90/100). All three of
          # those are now gone, for three reasons:
          #   1. It borrowed Greptile's exact glyphs for a DIFFERENT scale.
          #      /fix-pr consumes both; identical display, different meaning,
          #      in the one place that acts on them automatically.
          #   2. It was never load-bearing on its own - /fix-pr already
          #      required "no valid unfixed finding" AND a green gate
          #      alongside it, and those two are the real signal.
          #   3. Keeping it forced a permanent calibration-tuning problem
          #      (TEMPLE-11's bins, TEMPLE-38's score drift). With the score
          #      gone, a model swap changes the findings, not a number that
          #      then needs re-fitting.
          # /fix-pr's Step 6 exit condition is updated in the same change -
          # the two must move together, or the loop waits for a score that is
          # never emitted.
          # Off: this repo doesn't consistently link PRs to GitHub Issues, and
          # the ticket-compliance check mismatched this PR against an
          # unrelated, already-merged PR/issue (#26) on its first live run -
          # a false positive, not a real gap.
          PR_REVIEWER.REQUIRE_TICKET_ANALYSIS_REVIEW: "false"
          # Previously unset, so PR-Agent's default of 3 applied - a hard cap
          # on the exact symptom the quality log records ("thin to the point
          # of no code suggestions"). A monorepo PR can legitimately touch
          # apps/web, apps/bot and a shared package at once, which is already
          # three areas before any one of them has two things worth saying.
          # 5 rather than a rounder 6 deliberately: Archon's only two
          # confirmed failures are false positives, not misses, so headroom
          # is the thing to be stingy with. Raise it only if a real review
          # is observed hitting the cap with the 5th finding still valid.
          PR_REVIEWER.NUM_MAX_FINDINGS: "5"
          # Off: enable_review_labels_effort auto-adds a "Review effort N/5"
          # label to every PR, redundant with the effort line already in the
          # review comment body. enable_review_labels_security (default true,
          # untouched) stays - a security-flagged label is a useful at-a-
          # glance signal in the PR list; an effort label is not.
          PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: "false"
          # Off: PR-Agent's persistent-comment mechanism (git_provider.py
          # publish_persistent_comment_full) edits the main review comment in
          # place on every push - that part is fine and stays - but also
          # posts a SEPARATE new comment each time ("Persistent review
          # updated to latest commit ..."), which stacks with every push and
          # adds no information beyond what the in-place edit already shows.
          # This flag controls only that extra comment, not the edit itself.
          PR_REVIEWER.FINAL_UPDATE_MESSAGE: "false"
          # Reverted publish_description_as_comment (tried briefly): posting
          # /describe's output as a separate comment instead of editing the
          # PR description in place was worse in practice than the problem it
          # solved - in-place editing is preferred. Known, accepted tradeoff:
          # /describe's add_original_user_description only snapshots the
          # description as it was at PR creation, so manual edits made to
          # the description after that point can still get overwritten by a
          # later /describe run (confirmed once already on this PR). No
          # extra permission needed either way - publish_description() is a
          # plain PATCH /pulls/{number} via pull-requests: write, which is
          # already granted above.
          # These instructions now carry only two things: what to look for,
          # and what to stay silent about. The scoring/star-formatting half
          # is gone with require_score_review above (which also retires
          # TEMPLE-11's bin-calibration follow-up - there are no bins left to
          # calibrate).
          #
          # WHY DOMAIN RULES AT ALL: the quality log records Archon as
          # accurate but "thin to the point of no code suggestions on
          # straightforward application-logic diffs". Nothing in the prompt
          # told it what matters in THIS repo, so it reviewed generically.
          # These four rules are the things Greptile cannot know and CI
          # cannot check.
          #
          # WHY SO FEW: every mechanical rule handed to a single-shot
          # reviewer is a free chance at a false positive in exchange for
          # coverage that already exists. Deliberately NOT included, because
          # each already hard-fails deterministically: stale `pnpm --filter
          # <name>` (the always-on `filters` job in ci.yml), missing .js
          # import suffixes in packages/* (the bot job's "Verify production
          # entrypoint resolves all modules" step), formatting and lint
          # (oxlint/oxfmt/lefthook), types (tsc), secrets (Semgrep). Archon
          # has no tool loop and cannot read a file outside the diff - asking
          # it to check any of the above can only produce a guess, which is
          # the shape of both confirmed false positives to date.
          PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            CI already runs oxlint, oxfmt, tsc --noEmit, vitest, Semgrep and a
            full build, and lefthook runs lint/format/typecheck pre-commit.
            Never spend a finding on formatting, naming, import order,
            console.log, TODO comments, or anything a linter or the compiler
            already catches.
            Prioritise findings in this order.
            (1) AUTHZ. apps/web/src/server/api exposes publicProcedure,
            protectedProcedure, adminProcedure and scopedProcedure(...scopes).
            A new or modified publicProcedure that WRITES user, raid, character
            or attendance data, or that reads user-specific or otherwise
            sensitive data, is a finding unless the PR explicitly justifies
            public access. Public READS of raid, character or attendance data
            are not findings on their own - much of this site is public by
            design.
            (2) WIRE CONTRACT. apps/bot is a thin client over FOUR bot-facing
            /api/discord/* endpoints typed by @temple-era/contracts:
            check-permissions, create-raid, update-raid, update-bench. The
            fifth, proxy, serves Templar and has NO bot call site - judge it
            under the Templar freeze in docs/archon-review-context.md, never
            as a missing bot update. A semantic request
            or response change to one of the four is a finding when an
            affected handler, schema, or bot call site is not updated in the
            same PR.
            (3) MIGRATIONS. apps/web/drizzle. Flag destructive DDL (DROP,
            ALTER ... TYPE, NOT NULL on a populated column) with no backfill
            or guard, a schema change with no generated migration committed
            alongside it, and any data backfill that is not idempotent.
            (4) SHARED PACKAGES. packages/* compile to dist/ and are consumed
            as built output by apps/bot under Node16 module resolution. An
            exports map missing types or default is a finding.
            These four are a FILTER, not a checklist. Most PRs will trigger
            none of them, and finding nothing is the expected outcome - do not
            manufacture a finding per category. If a change is safe, say
            nothing; silence is a valid review. Never assert something about a
            file that is not in this diff.

      # TEMPLE-9: cosmetic-only. The step above is what actually reviews the
      # PR (now under the Archon App's own identity, via the token minted at
      # the top of this job); everything below just gives that result a
      # branded check run too. A GitHub App has no API to reskin "Archon /
      # PR review" itself (that check is owned by the GitHub Actions app
      # identity) - it can only add a second, separate check run under its
      # own avatar. if: always() so the badge still posts (as a failure)
      # when the PR Agent step above errors, rather than silently vanishing
      # alongside it. continue-on-error: true - a badge failing to post
      # (missing secrets, app not yet installed, GitHub API hiccup) must
      # never fail the actual review job above it.

      # Archon's own review on this PR caught it: the job has no checkout
      # (see the comment on the steps: block above - PR-Agent never needed
      # one), so without this, publish-archon-check.sh doesn't exist on the
      # runner and the step below fails at chmod every time, silently, since
      # continue-on-error hides it. Scoped to just this one script, not
      # moved earlier - the App-token and PR-Agent steps still don't need it.
      - name: Check out publish script
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Publish Archon check run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.archon_app_token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DETAILS_URL: ${{ github.event.pull_request.html_url }}
          PR_AGENT_OUTCOME: ${{ steps.pr_agent.outcome }}
        run: |
          chmod +x .github/scripts/publish-archon-check.sh
          .github/scripts/publish-archon-check.sh
