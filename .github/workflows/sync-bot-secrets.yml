name: Sync bot secrets to Northflank

# Northflank has no native Doppler integration, so Doppler is the source of truth
# and this pushes the values into the service's secret group.
#
# Deploy-triggered rather than scheduled: secrets land exactly when the bot is
# already rebuilding, so the restart this causes coincides with one that was
# happening anyway. A cron would restart an idle bot on a timer for nothing.
#
# The path filter mirrors Northflank's own `apps/web` ignore rule.
on:
  push:
    branches: [main]
    paths:
      - 'apps/bot/**'
      - '.github/workflows/sync-bot-secrets.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compare only — do not write to Northflank'
        type: boolean
        default: true

concurrency:
  group: sync-bot-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Sync secret group
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the two values that actually live in the secret group. The bot's
      # other variables (API_BASE_URL, DISCORD_RAID_LOGS_CHANNEL_ID, the cleanup
      # settings) are plain runtime env on the service and are deliberately not
      # managed here — pushing them would duplicate keys across two sources.
      #
      # Secrets arrive via Doppler's GitHub integration, which syncs temple-era/prd
      # into this repo's Actions secrets. NORTHFLANK_ACCESS_TOKEN is the exception:
      # it is CI infrastructure rather than app config, so it is a plain repo
      # secret and is deliberately kept out of Doppler, where it would otherwise
      # sync into Vercel too.
      #
      # Deliberately NOT scoped to a GitHub Environment. Environment secrets take
      # precedence over repo secrets of the same name, so a stale environment copy
      # would silently shadow the synced values.
      - name: Compare and sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TEMPLE_WEB_API_TOKEN: ${{ secrets.TEMPLE_WEB_API_TOKEN }}
          NORTHFLANK_ACCESS_TOKEN: ${{ secrets.NORTHFLANK_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          for v in DISCORD_BOT_TOKEN TEMPLE_WEB_API_TOKEN NORTHFLANK_ACCESS_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is empty. Check the Doppler -> GitHub sync."
              exit 1
            fi
            # Guard against the failure that bit the Vercel migration: a provider
            # placeholder silently stored as if it were the real value.
            case "${!v}" in
              "[SENSITIVE]"|"undefined"|"null")
                echo "::error::$v is the literal placeholder '${!v}' — refusing to sync."
                exit 1 ;;
            esac
          done

          # Do not swallow install failures — a silent failure here surfaces later
          # as a confusing "command not found".
          npm i -g @northflank/cli@0.11.7 >/dev/null

          # The CLI needs a login CONTEXT; NORTHFLANK_ACCESS_TOKEN alone is not
          # enough. On a developer machine `northflank login` has already written
          # ~/.northflank/config.json, which is why the env var appears sufficient
          # there — on a clean runner it fails with "No CLI context present".
          # `--token-login` creates that context non-interactively and validates
          # the token, so a bad one fails here rather than later.
          northflank login --token-login -t "$NORTHFLANK_ACCESS_TOKEN" -n ci --override

          # Auth preflight: confirm the context can actually read the group, so a
          # scope problem reports itself plainly instead of surfacing as an opaque
          # failure midway through the sync.
          if ! northflank list secrets --project temple-discord-bot -o json >/dev/null 2>&1; then
            echo "::error::Cannot read the secret group. Check that NORTHFLANK_ACCESS_TOKEN"
            echo "::error::is synced from Doppler and its role grants Project > Secrets >"
            echo "::error::SecretGroups > List, Read Keys, Read Values (and Update, to write)."
            northflank list secrets --project temple-discord-bot -o json 2>&1 | tail -5
            exit 1
          fi
          echo "auth ok — secret group readable"

          CURRENT=$(northflank get secret --project temple-discord-bot \
                      --secret temple-discord-bot -o json)

          # Capture from stdout. GITHUB_ENV is only read BETWEEN steps, so a value
          # appended to it here would not exist in this shell — and under `set -u`
          # the next reference would abort the script before either guard ran.
          CHANGED=$(node -e '
            const cur = JSON.parse(process.argv[1]);
            const s = cur.data ?? cur;
            // Fail loudly on an unexpected response shape. Defaulting to {} would
            // make every key look changed, so the skip-if-unchanged guard would
            // pass through and write — redeploying the bot and dropping its
            // gateway connection for no reason. An empty group is a real state
            // and is allowed; a MISSING variables object is not.
            const live = s && s.secrets && s.secrets.variables;
            if (!live || typeof live !== "object" || Array.isArray(live)) {
              console.error("::error::Unexpected Northflank response shape — expected .secrets.variables to be an object.");
              console.error("::error::Refusing to sync, since every key would appear changed and trigger a needless redeploy.");
              console.error("received top-level keys: " + Object.keys(s || {}).join(", "));
              process.exit(1);
            }
            const want = {
              DISCORD_BOT_TOKEN: process.env.DISCORD_BOT_TOKEN,
              TEMPLE_WEB_API_TOKEN: process.env.TEMPLE_WEB_API_TOKEN,
            };
            const diff = Object.keys(want).filter(k => live[k] !== want[k]);
            console.error("keys in secret group: " + (Object.keys(live).join(", ") || "(none)"));
            console.error("changed: " + (diff.length ? diff.join(", ") : "none"));
            process.stdout.write(String(diff.length));
          ' "$CURRENT")

          if [ "$CHANGED" = "0" ]; then
            echo "✅ Secret group already matches Doppler — skipping write."
            echo "   (A write would redeploy the service and drop the gateway connection.)"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 Dry run: $CHANGED value(s) would change. Not writing."
            exit 0
          fi

          PAYLOAD=$(node -e '
            console.log(JSON.stringify({ secrets: { variables: {
              DISCORD_BOT_TOKEN: process.env.DISCORD_BOT_TOKEN,
              TEMPLE_WEB_API_TOKEN: process.env.TEMPLE_WEB_API_TOKEN,
            }}}));
          ')

          echo "⚠️  Writing $CHANGED value(s) — this redeploys the bot."
          northflank update secret --project temple-discord-bot \
            --secret temple-discord-bot -i "$PAYLOAD"
          echo "✅ Synced."
