# One project for the whole monorepo. Values shared between apps —
# TEMPLE_WEB_API_TOKEN, DISCORD_BOT_TOKEN, DISCORD_RAID_LOGS_CHANNEL_ID — exist
# once here, so they cannot drift between web and bot. They previously lived in
# two projects and did drift.
#
# Run `doppler setup --no-interactive` in this directory.
setup:
  project: temple-era
  config: dev
