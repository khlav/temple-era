pre-commit:
  parallel: true
  commands:
    lint:
      glob: "{apps,packages}/**/src/**/*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "{apps,packages}/**/src/**/*.{ts,tsx,js,jsx}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm turbo run typecheck
    # `scripts:` entries never receive staged files as arguments - lefthook
    # only uses their glob to decide whether to run them, not to populate
    # "$@". {staged_files} is a `commands:`-only substitution, so this has to
    # live here (invoking the file, not inlining the logic) to actually scan
    # staged files only instead of falling back to a full-repo scan.
    semgrep-secrets:
      run: sh .lefthook/pre-commit/semgrep-secrets.sh {staged_files}
  # Inline multi-line `run:` blocks containing `$(...)` or a pipe corrupt in
  # transit when *git itself* invokes the hook on Windows (reproduces even
  # after lefthook 2.1.6 -> 2.1.10) - the identical script succeeds every
  # time run manually via `lefthook run` or `sh .git/hooks/pre-commit`. Only
  # file-based `scripts:` (already used below for commit-msg) are unaffected,
  # so these three are converted rather than left as `run:` strings.
  scripts:
    # Ported from the bot's husky pre-commit hook, removed in the monorepo
    # migration (R2). Warn-only — must never block a commit.
    "migrations.sh":
      runner: sh
    "console-log.sh":
      glob: "{apps,packages}/**/src/**/*.{ts,tsx}"
      runner: sh
    "todo-comments.sh":
      glob: "{apps,packages}/**/src/**/*.{ts,tsx}"
      runner: sh

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm turbo run lint
    build:
      # SKIP_ENV_VALIDATION: this hook checks that the code COMPILES, not that a
      # developer's environment is populated. Since apps/web moved to Doppler and
      # apps/web/.env was removed, an unset-env build fails on @t3-oss/env-nextjs
      # before it reaches a single type error. Requiring `doppler run` here would
      # make the hook fail for anyone not yet authenticated. Vercel still performs
      # real env validation at deploy time.
      run: SKIP_ENV_VALIDATION=1 pnpm turbo run build
  scripts:
    "branch-name.sh":
      runner: sh

commit-msg:
  scripts:
    "commit-msg.sh":
      runner: sh

prepare-commit-msg:
  scripts:
    "prepare-commit-msg.sh":
      runner: sh
